<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!--
      Title, description and OG tags are injected at runtime by main.tsx (via seo.ts).
      These generic values serve as fallbacks for non-JS crawlers that don't execute scripts.
      Edit tenant.config.ts → seo.* to change them for your tenant.
    -->
    <title>The Singing Canary · Karaoke &amp; Function Room · Newcastle</title>
    <meta name="description" content="Newcastle's home of karaoke, dancing and good times. Book our private function room for birthdays, hen dos, work parties and more." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Neutral dark defaults so the first paint matches this tenant's
         dark-mode-first theme rather than flashing white before correction.
         BrandThemeProvider applies the real tenant DB values on mount. -->
    <style>
      :root {
        --background: 15 21% 7%;
        --foreground: 32 44% 93%;
        --primary: 330 79% 56%;
        --primary-foreground: 32 44% 95%;
        --accent: 45 94% 49%;
        --accent-foreground: 20 20% 8%;
        --muted: 330 31% 13%;
        --muted-foreground: 30 20% 75%;
        --border: 330 25% 22%;
      }
      body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
    </style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Google Fonts preconnect — actual font URLs are injected by main.tsx -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
